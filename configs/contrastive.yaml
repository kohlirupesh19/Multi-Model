# Contrastive Pretraining Configuration (InfoNCE + Volumetric GRAM)
experiment_name: "contrastive_alignment"
seed: 42

hardware:
  device: "auto"
  precision: "float32"
  num_workers: 4

dataset:
  name: "multimodal_pretraining"
  cache_dir: "features_cache"
  max_samples: 5000
  stratified_split:
    train: 0.80
    val: 0.10
    test: 0.10

features:
  opcode:
    max_length: 2048
    sampling_mode: "importance"
    vocab_size: 8192
  cfg:
    max_nodes: 1000
    max_edges: 3000
    node_feat_dim: 16
    preserve_hubs: true
  syscall:
    max_length: 1024
    canonical_vocab_size: 256

model:
  latent_dim: 128
  opcode_encoder:
    type: "compact_transformer"
    vocab_size: 8192
    embed_dim: 128
    hidden_dim: 256
    num_layers: 4
    num_heads: 4
    dropout: 0.15
  cfg_encoder:
    type: "gin"
    in_dim: 16
    hidden_dim: 128
    num_layers: 4
    dropout: 0.15
  syscall_encoder:
    type: "bilstm"
    vocab_size: 256
    embed_dim: 128
    hidden_dim: 128
    num_layers: 2
    bidirectional: true
    dropout: 0.15
  fusion:
    type: "attention_weighted_late_fusion"
    projection_dim: 64
  classifier:
    num_classes: 2
    uncertainty_band: [0.38, 0.62]

training:
  stages: ["contrastive", "gram", "joint"]
  epochs: 15
  batch_size: 64
  lr_encoder: 2.0e-4
  lr_projection: 5.0e-4
  lr_classifier: 1.0e-3
  weight_decay: 1.0e-4
  tau: 0.05
  gamma: 0.75
  lambda_sep: 0.15
  patience: 5

evaluation:
  threshold_metric: "security"
  target_fnr: 0.01
  confidence_interval: 0.95
  report_leakage: true
