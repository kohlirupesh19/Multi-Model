<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 680" width="100%" height="100%" style="background:#0f172a; border-radius:10px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrowhead Marker (Main Flow) -->
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <!-- Arrowhead Marker (Exclusion) -->
    <marker id="arrow-excl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- STAGE 1: IDENTIFICATION -->
  <!-- Header Tag -->
  <rect x="25" y="15" width="130" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="30" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">1. IDENTIFICATION</text>

  <!-- Main Card: Database Queries -->
  <g transform="translate(25, 45)">
    <rect width="360" height="100" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="360" height="4" rx="2" fill="#38bdf8"/>
    <text x="18" y="26" fill="#38bdf8" font-size="11" font-weight="700">Records Identified from Databases (n = 1,420)</text>
    <text x="18" y="46" fill="#94a3b8" font-size="9.5">• IEEE Xplore: 412  |  ACM Digital Library: 325</text>
    <text x="18" y="64" fill="#94a3b8" font-size="9.5">• ScienceDirect: 280  |  SpringerLink: 235</text>
    <text x="18" y="82" fill="#94a3b8" font-size="9.5">• arXiv Preprints (Cs.CR): 168</text>
  </g>

  <!-- Flow Arrow: 1 -> 2 -->
  <path d="M 205 145 L 205 195" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-flow)"/>

  <!-- Exclusion Arrow 1 -->
  <path d="M 385 95 L 435 95" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-excl)"/>

  <!-- Exclusion Card 1: Duplicates -->
  <g transform="translate(440, 55)">
    <rect width="275" height="80" rx="8" fill="rgba(153, 27, 27, 0.2)" stroke="#dc2626" stroke-width="1.2"/>
    <text x="15" y="24" fill="#f87171" font-size="10.5" font-weight="700">Records Removed Before Screening</text>
    <text x="15" y="44" fill="#f8fafc" font-size="10">• Duplicate entries: n = 312</text>
    <text x="15" y="62" fill="#f8fafc" font-size="10">• Ineligible publication date: n = 103</text>
  </g>


  <!-- STAGE 2: SCREENING -->
  <!-- Header Tag -->
  <rect x="25" y="172" width="115" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="82" y="187" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">2. SCREENING</text>

  <!-- Main Card: Title & Abstract Screening -->
  <g transform="translate(25, 202)">
    <rect width="360" height="90" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1.5"/>
    <rect width="360" height="4" rx="2" fill="#38bdf8"/>
    <text x="18" y="26" fill="#f8fafc" font-size="11" font-weight="700">Records Screened (n = 1,005)</text>
    <text x="18" y="46" fill="#94a3b8" font-size="9.5">Evaluation against title and abstract criteria</text>
    <text x="18" y="66" fill="#94a3b8" font-size="9.5">Focus: Binary code representations &amp; Deep Learning</text>
  </g>

  <!-- Flow Arrow: 2 -> 3 -->
  <path d="M 205 292 L 205 342" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-flow)"/>

  <!-- Exclusion Arrow 2 -->
  <path d="M 385 247 L 435 247" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-excl)"/>

  <!-- Exclusion Card 2: Title/Abstract Exclusions -->
  <g transform="translate(440, 202)">
    <rect width="275" height="90" rx="8" fill="rgba(153, 27, 27, 0.2)" stroke="#dc2626" stroke-width="1.2"/>
    <text x="15" y="22" fill="#f87171" font-size="10.5" font-weight="700">Records Excluded (n = 620)</text>
    <text x="15" y="42" fill="#f8fafc" font-size="9.5">• Non-binary / web-only attacks: n = 340</text>
    <text x="15" y="59" fill="#f8fafc" font-size="9.5">• Signature/heuristic only (no DL): n = 185</text>
    <text x="15" y="76" fill="#f8fafc" font-size="9.5">• Non-English / extended abstracts: n = 95</text>
  </g>


  <!-- STAGE 3: ELIGIBILITY -->
  <!-- Header Tag -->
  <rect x="25" y="322" width="115" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="82" y="337" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">3. ELIGIBILITY</text>

  <!-- Main Card: Full-Text Eligibility -->
  <g transform="translate(25, 350)">
    <rect width="360" height="95" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1.5"/>
    <rect width="360" height="4" rx="2" fill="#38bdf8"/>
    <text x="18" y="26" fill="#f8fafc" font-size="11" font-weight="700">Full-Text Articles Assessed (n = 385)</text>
    <text x="18" y="46" fill="#94a3b8" font-size="9.5">Rigorous deep technical assessment of architecture,</text>
    <text x="18" y="64" fill="#94a3b8" font-size="9.5">feature extraction pipelines, and validation rigor.</text>
    <text x="18" y="82" fill="#38bdf8" font-size="9" font-weight="600">Retrieval rate: 100% of sought reports retrieved</text>
  </g>

  <!-- Flow Arrow: 3 -> 4 -->
  <path d="M 205 445 L 205 500" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-flow)"/>

  <!-- Exclusion Arrow 3 -->
  <path d="M 385 397 L 435 397" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-excl)"/>

  <!-- Exclusion Card 3: Full-Text Exclusions -->
  <g transform="translate(440, 350)">
    <rect width="275" height="95" rx="8" fill="rgba(153, 27, 27, 0.2)" stroke="#dc2626" stroke-width="1.2"/>
    <text x="15" y="22" fill="#f87171" font-size="10.5" font-weight="700">Full-Text Excluded (n = 301)</text>
    <text x="15" y="42" fill="#f8fafc" font-size="9.5">• Source-code only (no raw binary): n = 132</text>
    <text x="15" y="59" fill="#f8fafc" font-size="9.5">• Unimodal only (no fusion): n = 109</text>
    <text x="15" y="76" fill="#f8fafc" font-size="9.5">• Data leakage / temporal flaw: n = 60</text>
  </g>


  <!-- STAGE 4: INCLUDED -->
  <!-- Header Tag -->
  <rect x="25" y="475" width="115" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="82" y="490" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">4. INCLUDED</text>

  <!-- Main Card: Final Corpus -->
  <g transform="translate(25, 505)">
    <rect width="690" height="145" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2"/>
    <rect width="690" height="5" rx="2" fill="#10b981"/>
    <text x="25" y="32" fill="#10b981" font-size="13" font-weight="700">Studies Included in Systematic Synthesis Corpus (n = 84)</text>
    
    <rect x="25" y="48" width="315" height="78" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
    <text x="40" y="72" fill="#f8fafc" font-size="11" font-weight="700">Multi-Modal Deep Learning (n = 36)</text>
    <text x="40" y="92" fill="#94a3b8" font-size="9.5">• Opcode Sequence Transformers: 14</text>
    <text x="40" y="108" fill="#94a3b8" font-size="9.5">• Control Flow Graph Neural Nets (GIN/GCN): 12</text>
    <text x="40" y="124" fill="#94a3b8" font-size="9.5">• Dynamic Syscall Behavioral Models: 10</text>

    <rect x="360" y="48" width="335" height="78" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
    <text x="375" y="72" fill="#f8fafc" font-size="11" font-weight="700">Contrastive &amp; Fusion Rigor (n = 48)</text>
    <text x="375" y="92" fill="#94a3b8" font-size="9.5">• Multi-Modal Metric &amp; Contrastive Learning: 18</text>
    <text x="375" y="108" fill="#94a3b8" font-size="9.5">• Late Fusion &amp; Modality Gating Systems: 16</text>
    <text x="375" y="124" fill="#94a3b8" font-size="9.5">• Zero-Day &amp; Adversarial Evasion Benchmarks: 14</text>
  </g>
</svg>