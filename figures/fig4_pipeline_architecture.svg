<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- STAGE CONTAINERS -->
  <!-- Stage 1 -->
  <rect x="170" y="25" width="220" height="470" rx="10" fill="rgba(30, 41, 59, 0.45)" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <text x="280" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">STAGE 1: FEATURE EXTRACTION</text>

  <!-- Stage 2 -->
  <rect x="415" y="25" width="220" height="470" rx="10" fill="rgba(30, 41, 59, 0.45)" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <text x="525" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">STAGE 2: NEURAL ENCODERS</text>

  <!-- Stage 3 -->
  <rect x="660" y="25" width="230" height="470" rx="10" fill="rgba(30, 41, 59, 0.45)" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <text x="775" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">STAGE 3: CONTRASTIVE ALIGNMENT</text>

  <!-- Stage 4 & 5 -->
  <rect x="915" y="25" width="265" height="470" rx="10" fill="rgba(30, 41, 59, 0.45)" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <text x="1047" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">STAGE 4 &amp; 5: FUSION &amp; HEADS</text>

  <!-- CONNECTOR PATHS -->
  <!-- PE to Stage 1 -->
  <path d="M 135 260 C 150 260, 160 130, 185 130" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 135 260 L 185 260" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 135 260 C 150 260, 160 390, 185 390" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- Stage 1 to Stage 2 -->
  <path d="M 375 130 L 430 130" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 375 260 L 430 260" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 375 390 L 430 390" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- Stage 2 to Stage 3 -->
  <path d="M 620 130 C 640 130, 650 230, 675 230" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 620 260 L 675 260" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 620 390 C 640 390, 650 290, 675 290" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- Stage 3 to Stage 4 & 5 -->
  <path d="M 875 220 C 895 220, 905 160, 930 160" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <path d="M 875 300 C 895 300, 905 380, 930 380" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <path d="M 1047 225 L 1047 295" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr-indigo)"/>

  <!-- CARDS -->
  <!-- 0. Raw Binary -->
  <g transform="translate(20, 200)">
    <rect width="115" height="120" rx="8" fill="rgba(100, 116, 139, 0.15)" stroke="#64748b" stroke-width="1.5"/>
    <rect width="115" height="5" rx="2" fill="#64748b"/>
    <text x="57" y="32" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">[INPUT]</text>
    <text x="57" y="55" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Raw Binary</text>
    <text x="57" y="78" fill="#94a3b8" font-size="10.5" text-anchor="middle">PE32 / ELF</text>
    <text x="57" y="96" fill="#94a3b8" font-size="10" text-anchor="middle">Static + Dynamic</text>
  </g>

  <!-- 1. Stage 1 Cards -->
  <!-- Opcode Extractor -->
  <g transform="translate(190, 75)">
    <rect width="185" height="110" rx="8" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="185" height="5" rx="2" fill="#0284c7"/>
    <text x="92" y="28" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">[OPCODE MODALITY]</text>
    <text x="92" y="50" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Static Disassembly</text>
    <text x="92" y="72" fill="#94a3b8" font-size="10.5" text-anchor="middle">Capstone Engine • N-grams</text>
    <text x="92" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">Norm: &lt;REG&gt;, &lt;MEM&gt;, &lt;IMM&gt;</text>
  </g>

  <!-- CFG Extractor -->
  <g transform="translate(190, 205)">
    <rect width="185" height="110" rx="8" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-width="1.5"/>
    <rect width="185" height="5" rx="2" fill="#059669"/>
    <text x="92" y="28" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">[GRAPH MODALITY]</text>
    <text x="92" y="50" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Control Flow Graph</text>
    <text x="92" y="72" fill="#94a3b8" font-size="10.5" text-anchor="middle">Basic Block Topology</text>
    <text x="92" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">16-D Continuous Features</text>
  </g>

  <!-- Syscall Extractor -->
  <g transform="translate(190, 335)">
    <rect width="185" height="110" rx="8" fill="rgba(217, 119, 6, 0.15)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="185" height="5" rx="2" fill="#d97706"/>
    <text x="92" y="28" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">[DYNAMIC MODALITY]</text>
    <text x="92" y="50" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Dynamic Syscalls</text>
    <text x="92" y="72" fill="#94a3b8" font-size="10.5" text-anchor="middle">Cuckoo / Sandbox Traces</text>
    <text x="92" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">Standardized API Sequence</text>
  </g>

  <!-- 2. Stage 2 Cards -->
  <!-- Transformer -->
  <g transform="translate(435, 75)">
    <rect width="185" height="110" rx="8" fill="rgba(2, 132, 199, 0.18)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="185" height="5" rx="2" fill="#0284c7"/>
    <text x="92" y="28" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">z₁ ∈ ℝ¹²⁸</text>
    <text x="92" y="50" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Compact Transformer</text>
    <text x="92" y="72" fill="#94a3b8" font-size="10.5" text-anchor="middle">2-Layer Self-Attention</text>
    <text x="92" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">4 Heads • Positional Enc</text>
  </g>

  <!-- CFG-GIN -->
  <g transform="translate(435, 205)">
    <rect width="185" height="110" rx="8" fill="rgba(5, 150, 105, 0.18)" stroke="#059669" stroke-width="1.5"/>
    <rect width="185" height="5" rx="2" fill="#059669"/>
    <text x="92" y="28" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">z₂ ∈ ℝ¹²⁸</text>
    <text x="92" y="50" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Graph Isomorphism Net</text>
    <text x="92" y="72" fill="#94a3b8" font-size="10.5" text-anchor="middle">3-Layer GINConv (ε-param)</text>
    <text x="92" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">Concat Mean + Max Readout</text>
  </g>

  <!-- Syscall BiLSTM -->
  <g transform="translate(435, 335)">
    <rect width="185" height="110" rx="8" fill="rgba(217, 119, 6, 0.18)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="185" height="5" rx="2" fill="#d97706"/>
    <text x="92" y="28" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">z₃ ∈ ℝ¹²⁸</text>
    <text x="92" y="50" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Syscall BiLSTM</text>
    <text x="92" y="72" fill="#94a3b8" font-size="10.5" text-anchor="middle">1-Layer Bidirectional Cell</text>
    <text x="92" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">Missing-Modality Learned Prior</text>
  </g>

  <!-- 3. Stage 3 Alignment Card -->
  <g transform="translate(680, 150)">
    <rect width="195" height="220" rx="8" fill="rgba(139, 92, 246, 0.18)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="195" height="5" rx="2" fill="#8b5cf6"/>
    <text x="97" y="32" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">[HYPERSPHERE ALIGNMENT]</text>
    <text x="97" y="58" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">ℓ₂ Manifold 𝕊¹²⁷</text>
    <text x="97" y="80" fill="#94a3b8" font-size="10.5" text-anchor="middle">||z_m||₂ = 1  (d = 128)</text>
    <line x1="20" y1="95" x2="175" y2="95" stroke="#475569" stroke-width="1"/>
    <text x="97" y="118" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Pairwise InfoNCE</text>
    <text x="97" y="136" fill="#94a3b8" font-size="9.5" text-anchor="middle">Cross-Modal Attraction/Repulsion</text>
    <line x1="20" y1="150" x2="175" y2="150" stroke="#475569" stroke-width="1"/>
    <text x="97" y="174" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Volumetric GRAM</text>
    <text x="97" y="194" fill="#94a3b8" font-size="9.5" text-anchor="middle">min det(G⁺) - λ log(1+det(G⁻))</text>
  </g>

  <!-- 4. Stage 4 Attention Late Fusion Card -->
  <g transform="translate(935, 75)">
    <rect width="225" height="140" rx="8" fill="rgba(99, 102, 241, 0.18)" stroke="#6366f1" stroke-width="1.5"/>
    <rect width="225" height="5" rx="2" fill="#6366f1"/>
    <text x="112" y="28" fill="#818cf8" font-size="10" font-weight="700" text-anchor="middle">[STAGE 4: LATE FUSION]</text>
    <text x="112" y="52" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Attention Channel Gating</text>
    <text x="112" y="75" fill="#94a3b8" font-size="10.5" text-anchor="middle">Reliability Weights [α₁, α₂, α₃]</text>
    <text x="112" y="95" fill="#94a3b8" font-size="10" text-anchor="middle">Softmax Masking (-10⁹) for Faults</text>
    <text x="112" y="120" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">z_fused = Σ α_m · z_m</text>
  </g>

  <!-- 5. Stage 5 Downstream Inference Heads Card -->
  <g transform="translate(935, 305)">
    <rect width="225" height="150" rx="8" fill="rgba(13, 148, 136, 0.18)" stroke="#0d9488" stroke-width="1.5"/>
    <rect width="225" height="5" rx="2" fill="#0d9488"/>
    <text x="112" y="28" fill="#2dd4bf" font-size="10" font-weight="700" text-anchor="middle">[STAGE 5: INFERENCE]</text>
    <text x="112" y="52" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Multi-Task Decision Heads</text>
    <text x="112" y="76" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Malware Classifier</text>
    <text x="112" y="94" fill="#94a3b8" font-size="10" text-anchor="middle">2-Layer MLP • P(Malware | z_fused)</text>
    <line x1="25" y1="108" x2="200" y2="108" stroke="#334155" stroke-width="1"/>
    <text x="112" y="128" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">FAISS Similarity Engine</text>
    <text x="112" y="144" fill="#94a3b8" font-size="10" text-anchor="middle">Hyperspherical Cosine k-NN</text>
  </g>
</svg>