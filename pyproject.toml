[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-malware"
version = "1.0.0"
description = "Geometric Multimodal Representation Learning with Availability-Aware Fusion for Executable Program Analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Project Maintainers"}
]
keywords = [
    "malware-analysis",
    "deep-learning",
    "multimodal-learning",
    "graph-neural-networks",
    "contrastive-learning",
    "pytorch"
]
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "streamlit>=1.35.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "capstone>=5.0.0",
    "lief>=0.14.0",
    "plotly>=5.20.0",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "scipy>=1.12.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov"
]

[tool.setuptools.packages.find]
include = ["multimodal_malware*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
